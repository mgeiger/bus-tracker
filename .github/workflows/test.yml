name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Tests
        # We run the tests inside the container. 
        # We'll use a specific test command that handles pytest and coverage.
        run: |
          docker compose build web
          docker compose run --rm web bash -c "pip install pytest pytest-cov && pytest --cov=. --cov-fail-under=75"
